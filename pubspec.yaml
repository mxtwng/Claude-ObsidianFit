name: obsidian_fit
description: "Local-first fitness tracker: GPS activities and gym workouts stored as plain Markdown and GPX."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # SQLite read-cache (Drift ORM)
  drift: ^2.28.0
  drift_flutter: ^0.2.7

  # Platform directory resolution
  path_provider: ^2.1.5

  # YAML frontmatter parsing.
  # NOTE: parsing currently goes through `yaml` + FrontMatterCodec
  # (lib/services/FrontMatterCodec.dart). `front_matter` is declared as requested;
  # version is unpinned because it could not be verified here. Run
  # `flutter pub upgrade front_matter` and pin the resolved version.
  yaml: ^3.1.3

  # Formatting and ID generation
  intl: ^0.20.2
  uuid: ^4.5.1

  # Small utility packages used directly by lib/ code
  collection: ^1.19.0
  path: ^1.9.0
  permission_handler: ^13.0.2
  xml: ^7.1.0
  geolocator: ^14.1.2
  flutter_blue_plus: ^2.3.14
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.3.2
  maplibre_gl: ^0.27.1

  # Keeps the display on during workouts and GPS recording.
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
